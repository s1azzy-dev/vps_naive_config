---
argument_specs:
  main:
    short_description: Validate inputs for the docker role
    options:
      docker_manage_service:
        type: bool
        default: true
      docker_managed_user:
        type: str
        required: true
      docker_apt_key_sha256:
        type: str
        required: true
      docker_packages:
        type: list
        elements: str
        required: true
      docker_conflicting_packages:
        type: list
        elements: str
        required: true
