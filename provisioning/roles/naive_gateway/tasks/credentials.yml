---
- name: Prepare credentials without exposing values or rotating on retry
  no_log: true
  block:
    - name: Inspect active and pending runtime files
      ansible.builtin.stat:
        path: "{{ naive_gateway_config_dir }}/{{ item }}"
      loop: [gateway.env, gateway.env.pending]
      register: naive_gateway_runtime_files

    - name: Require private regular runtime files
      ansible.builtin.assert:
        that:
          - item.stat.isreg | default(false)
          - item.stat.uid == 0
          - item.stat.gid == 0
          - item.stat.mode == '0600'
        quiet: true
      loop: "{{ naive_gateway_runtime_files.results }}"
      when: item.stat.exists

    - name: Select the credential source
      ansible.builtin.set_fact:
        naive_gateway_existing_env: >-
          {{ 'gateway.env' if naive_gateway_runtime_files.results[0].stat.exists else
             ('gateway.env.pending' if naive_gateway_runtime_files.results[1].stat.exists else '') }}
        naive_gateway_credentials: {}

    - name: Read existing credentials privately
      ansible.builtin.slurp:
        src: "{{ naive_gateway_config_dir }}/{{ naive_gateway_existing_env }}"
      register: naive_gateway_saved_env
      when: naive_gateway_existing_env | length > 0

    - name: Parse saved runtime values without executing dotenv content
      ansible.builtin.set_fact:
        naive_gateway_credentials: >-
          {{ dict((naive_gateway_saved_env.content | b64decode).splitlines() | map('split', '=', 1)) }}
      when: naive_gateway_existing_env | length > 0

    - name: Reject corrupt saved credentials
      ansible.builtin.assert:
        that:
          - naive_gateway_credentials.keys() | sort == ['ACME_EMAIL', 'DOMAIN', 'NAIVE_PASSWORD', 'NAIVE_USER']
          - naive_gateway_credentials.NAIVE_USER is match('^[A-Za-z0-9._~-]+$')
          - naive_gateway_credentials.NAIVE_PASSWORD is match('^[A-Za-z0-9._~-]+$')
        quiet: true
      when: naive_gateway_existing_env | length > 0

    - name: Apply an explicitly supplied credential pair
      ansible.builtin.set_fact:
        naive_gateway_credentials:
          NAIVE_USER: "{{ naive_gateway_user }}"
          NAIVE_PASSWORD: "{{ naive_gateway_password }}"
      when: naive_gateway_user | length > 0

    - name: Generate credentials only when no pair has been saved
      ansible.builtin.command:
        argv: [/usr/bin/openssl, rand, -hex, '32']
      loop: [username, password]
      register: naive_gateway_generated_credentials
      changed_when: false
      when: naive_gateway_credentials | length == 0

    - name: Use the freshly generated pair
      ansible.builtin.set_fact:
        naive_gateway_credentials:
          NAIVE_USER: "{{ naive_gateway_generated_credentials.results[0].stdout[:16] }}"
          NAIVE_PASSWORD: "{{ naive_gateway_generated_credentials.results[1].stdout }}"
      when: naive_gateway_credentials | length == 0

    - name: Atomically persist the candidate for retries before validation
      ansible.builtin.template:
        src: gateway.env.j2
        dest: "{{ naive_gateway_config_dir }}/gateway.env.pending"
        owner: root
        group: root
        mode: "0600"
