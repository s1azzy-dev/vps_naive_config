---
- name: Ensure the OpenSSH drop-in directory exists
  ansible.builtin.file:
    path: /etc/ssh/sshd_config.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install the validated OpenSSH hardening drop-in
  ansible.builtin.template:
    src: "{{ ssh_hardening_template }}"
    dest: /etc/ssh/sshd_config.d/00-naive-gateway-hardening.conf
    owner: root
    group: root
    mode: "0600"
    validate: /usr/sbin/sshd -t -f %s
  notify: Validate and reload OpenSSH
