---
- name: Require a valid configured SSH port
  ansible.builtin.assert:
    that:
      - firewall_ssh_port >= 1
      - firewall_ssh_port <= 65535
    fail_msg: "Invalid firewall SSH port: {{ firewall_ssh_port }}"
    quiet: true

- name: Inspect Docker ownership before changing host firewall state
  ansible.builtin.stat:
    path: /etc/naive-gateway/docker-managed
  register: firewall_docker_marker

- name: Inspect Docker artifacts before changing host firewall state
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - /usr/bin/docker
    - /usr/bin/dockerd
    - /usr/local/bin/docker
    - /usr/local/bin/dockerd
    - /snap/bin/docker
  loop_control:
    label: "{{ item }}"
  register: firewall_docker_artifacts

- name: Refuse to reconcile firewall around unmanaged Docker
  ansible.builtin.assert:
    that:
      - >-
        firewall_docker_artifacts.results | selectattr('stat.exists') | list | length == 0 or
        (firewall_docker_marker.stat.isreg | default(false) and
         firewall_docker_marker.stat.pw_name == 'root' and
         firewall_docker_marker.stat.gr_name == 'root' and
         firewall_docker_marker.stat.mode == '0600')
    fail_msg: >-
      Docker is present without this project's management marker. Refusing to
      change UFW or Docker forwarding state.
    quiet: true

- name: Install UFW
  ansible.builtin.apt:
    name: ufw
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Inspect existing explicit UFW rules
  ansible.builtin.command:
    argv:
      - /usr/sbin/ufw
      - show
      - added
  register: firewall_ufw_added
  changed_when: false

- name: Derive the expected and existing UFW rule sets
  ansible.builtin.set_fact:
    firewall_expected_rules:
      - "ufw limit {{ firewall_ssh_port }}/tcp"
      - ufw allow 80/tcp
      - ufw allow 443/tcp
    firewall_existing_rules: >-
      {{ firewall_ufw_added.stdout_lines |
         select('match', '^ufw ') | list }}

- name: Refuse to overwrite unmanaged UFW rules
  ansible.builtin.assert:
    that:
      - firewall_existing_rules | difference(firewall_expected_rules) | length == 0
    fail_msg: >-
      Existing UFW rules are not managed by this project. Refusing to replace
      them automatically: {{ firewall_existing_rules | difference(firewall_expected_rules) }}
    quiet: true

- name: Limit inbound SSH before enabling UFW
  community.general.ufw:
    rule: limit
    port: "{{ firewall_ssh_port }}"
    proto: tcp

- name: Allow gateway TCP ports before enabling UFW
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop:
    - 80
    - 443
  loop_control:
    label: "{{ item }}/tcp"

- name: Deny incoming traffic by default
  community.general.ufw:
    direction: incoming
    default: deny

- name: Allow outgoing traffic by default
  community.general.ufw:
    direction: outgoing
    default: allow

- name: Enable UFW after all allow rules exist
  community.general.ufw:
    state: enabled

- name: Read the effective UFW status
  ansible.builtin.command:
    argv:
      - /usr/sbin/ufw
      - status
      - verbose
  register: firewall_ufw_status
  changed_when: false

- name: Require active UFW with the expected default policies
  ansible.builtin.assert:
    that:
      - "'Status: active' in firewall_ufw_status.stdout"
      - "'Default: deny (incoming), allow (outgoing)' in firewall_ufw_status.stdout"
    fail_msg: "UFW did not become active with the required default policies."
    quiet: true

- name: Render the candidate Docker ingress policies in memory
  ansible.builtin.set_fact:
    firewall_docker_ipv4_candidate: >-
      {{ lookup('ansible.builtin.template', firewall_docker_ipv4_template) }}
    firewall_docker_ipv6_candidate: >-
      {{ lookup('ansible.builtin.template', firewall_docker_ipv6_template) }}
  no_log: true

- name: Validate the candidate Docker ingress policies before writing them
  ansible.builtin.command:
    argv:
      - "/usr/sbin/{{ item.binary }}"
      - --test
    stdin: "{{ item.candidate }}"
  loop:
    - binary: iptables-restore
      candidate: "{{ firewall_docker_ipv4_candidate }}"
    - binary: ip6tables-restore
      candidate: "{{ firewall_docker_ipv6_candidate }}"
  loop_control:
    label: "{{ item.binary }}"
  changed_when: false
  no_log: true

- name: Install the validated IPv4 Docker ingress policy
  ansible.builtin.blockinfile:
    path: /etc/ufw/after.rules
    marker: "# {mark} ANSIBLE MANAGED NAIVE GATEWAY DOCKER INGRESS"
    block: "{{ firewall_docker_ipv4_candidate }}"
    owner: root
    group: root
    mode: "0640"
  notify: Reload UFW

- name: Install the validated IPv6 Docker ingress policy
  ansible.builtin.blockinfile:
    path: /etc/ufw/after6.rules
    marker: "# {mark} ANSIBLE MANAGED NAIVE GATEWAY DOCKER INGRESS"
    block: "{{ firewall_docker_ipv6_candidate }}"
    owner: root
    group: root
    mode: "0640"
  notify: Reload UFW

- name: Activate the validated Docker ingress policies
  ansible.builtin.meta: flush_handlers

- name: Require the managed Docker ingress jump for both address families
  ansible.builtin.command:
    argv:
      - "/usr/sbin/{{ item }}"
      - --check
      - DOCKER-USER
      - --jump
      - NAIVE-GATEWAY-DOCKER
  loop:
    - iptables
    - ip6tables
  loop_control:
    label: "{{ item }}"
  changed_when: false

- name: Require the Docker bridge deny rule for both address families
  ansible.builtin.command:
    argv:
      - "/usr/sbin/{{ item }}"
      - --check
      - NAIVE-GATEWAY-DOCKER
      - --out-interface
      - docker0
      - --jump
      - DROP
  loop:
    - iptables
    - ip6tables
  loop_control:
    label: "{{ item }}"
  changed_when: false
