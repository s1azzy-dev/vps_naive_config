[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "naive-gateway-controller"
version = "0.1.0"
description = "Typed local controller for Naive Gateway provisioning"
requires-python = ">=3.14,<3.15"
dependencies = [
  "dnspython==2.9.0",
  "passlib==1.7.4",
  "pydantic-settings==2.16.2",
]

[project.scripts]
gateway-controller = "naive_gateway_controller.cli:main"

[dependency-groups]
dev = [
  "ansible-core==2.21.5",
  "ansible-lint==26.10.1",
  "molecule==26.10.0",
  "molecule-plugins[docker]==26.10.12",
  "mypy==2.4.1",
  "pytest==9.2.0",
  "pytest-testinfra==10.2.2",
  "ruff==0.17.3",
  "uv==0.13.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/naive_gateway_controller"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.per-file-target-version]
"scripts/*.py" = "py311"
"provisioning/files/*.py" = "py311"
"src/naive_gateway_controller/repository.py" = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "PT", "PTH", "RUF", "S", "SIM", "UP"]
ignore = [
  "COM812",
  "D203",
  "D213",
  "E501",
  "S603",
  "S607",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105"]
"provisioning/molecule/**/tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["passlib", "passlib.*", "yaml"]
ignore_missing_imports = true
